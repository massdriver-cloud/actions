name: 'Setup Massdriver CLI'
description: |
  Installs the Massdriver CLI on the runner.
author: 'Massdriver, Inc.'
inputs:
  tag:
    description: |
      The release tag to fetch. Can be either a tag like `2.0.0` or `latest`.
      Releases can be found at https://github.com/massdriver-cloud/mass.
    required: false
    default: 'latest'
  token:
    description: |
      The GitHub token used to fetch a release. Set automatically by GitHub Actions.
    required: false
    default: ${{ github.token }}
runs:
  using: node20
  main: '../dist/setup/index.js'
