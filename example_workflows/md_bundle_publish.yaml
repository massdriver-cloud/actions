name: Massdriver Bundle Publish
on:
  push:
    branches: [main]

# Publish a bundle to Massdriver on every push to main. The publish
# action is a no-op when the contents of bundle-directory haven't
# changed since the previous commit, so it's safe to run on every push.

env:
  MASSDRIVER_API_KEY: ${{secrets.MASSDRIVER_API_KEY}}
  MASSDRIVER_ORG_ID: ${{secrets.MASSDRIVER_ORG_ID}}

jobs:
  publish:
    name: Publish Bundle to Massdriver
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Massdriver CLI
        uses: massdriver-cloud/actions/setup@v6
      - name: Publish Bundle
        uses: massdriver-cloud/actions/bundle_publish@v6
        with:
          bundle-directory: ./bundle
